name: Job board

# Keeps /jobs/ fresh with no one at a keyboard.
# Every morning from about 04:15 WAT (and whenever a sheet is dropped into
# jobs/inbox/, the settings change, or you press "Run workflow" in the
# Actions tab) it:
#   1. imports sheets in jobs/inbox/ (rows dated today or yesterday)
#   2. pulls new Nigeria-eligible roles from the feeds in jobs/data/config.json
#   3. re-opens every live apply link and takes down closed roles
#   4. removes expired roles and rebuilds jobs/index.html
# The run report (what was added, closed, turned away and why) is in the
# Actions log for each run.

on:
  schedule:
    # GitHub starts scheduled runs late when it is busy (hours, at peak times),
    # so the board is attempted three times each morning at off-peak minutes.
    # Repeat runs the same day are harmless: listings are never added twice and
    # the micro1 quota counts what was already added today.
    - cron: "13 3 * * *"   # 04:13 WAT
    - cron: "37 4 * * *"   # 05:37 WAT
    - cron: "47 6 * * *"   # 07:47 WAT
  push:
    branches: [main]
    paths:
      - "jobs/inbox/**"
      - "jobs/data/config.json"
      - "jobboard.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobboard
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the sheet reader
        run: pip install openpyxl

      - name: Update the board
        env:
          JOBBOARD_SUMMARY: ${{ runner.temp }}/jobboard-summary.txt
        run: python3 jobboard.py daily

      - name: Validate facts
        run: python3 validate-facts.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "board already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A jobs sitemap.xml
          if [ -s "$RUNNER_TEMP/jobboard-summary.txt" ]; then
            git commit -F "$RUNNER_TEMP/jobboard-summary.txt"
          else
            git commit -m "Job board: daily update"
          fi
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
