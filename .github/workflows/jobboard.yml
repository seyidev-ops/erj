name: Job board

# Keeps /jobs/ fresh with no one at a keyboard.
# Four times a day (6am, 8am, 2pm and 8pm WAT), whenever a sheet is dropped
# into jobs/inbox/, the settings change, or you press "Run workflow" in the
# Actions tab, it:
#   1. imports every eligible row of the sheets in jobs/inbox/
#   2. pulls new Nigeria-eligible roles from the company boards in
#      jobs/data/config.json (no daily cap: every eligible role goes up)
#   3. re-opens every live apply link and takes down closed roles
#   4. removes expired roles and rebuilds jobs/index.html
# No Firecrawl here: every source is a free public API. The run report
# (what was added, closed, turned away and why) is in the Actions log.

on:
  schedule:
    # Cron is UTC (WAT = UTC+1). Each run is set 12 minutes early because
    # GitHub starts scheduled runs late when it is busy, and runs on the hour
    # are the most delayed. Repeat runs are harmless: nothing is added twice.
    - cron: "48 4 * * *"    # 05:48 WAT -> board updated around 6am
    - cron: "48 6 * * *"    # 07:48 WAT -> around 8am
    - cron: "48 12 * * *"   # 13:48 WAT -> around 2pm
    - cron: "48 18 * * *"   # 19:48 WAT -> around 8pm
  push:
    branches: [main]
    paths:
      - "jobs/inbox/**"
      - "jobs/data/config.json"
      - "jobboard.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobboard
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the sheet reader
        run: pip install openpyxl

      - name: Update the board
        env:
          JOBBOARD_SUMMARY: ${{ runner.temp }}/jobboard-summary.txt
        run: python3 jobboard.py daily

      - name: Validate facts
        run: python3 validate-facts.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "board already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A jobs sitemap.xml
          if [ -s "$RUNNER_TEMP/jobboard-summary.txt" ]; then
            git commit -F "$RUNNER_TEMP/jobboard-summary.txt"
          else
            git commit -m "Job board: daily update"
          fi
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
