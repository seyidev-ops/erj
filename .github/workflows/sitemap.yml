name: Sitemap and facts

# Keeps sitemap.xml in step with the blog without anyone having to remember.
# Runs on every push to main (including "Add files via upload"), once a day
# just after midnight WAT so scheduled posts are listed on their publish date,
# and on demand from the Actions tab. On pull requests it only checks.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "5 23 * * *"   # 00:05 WAT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate sitemap
        if: github.event_name != 'pull_request'
        run: python3 generate-sitemap.py

      - name: Commit sitemap if it changed
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap.xml with newly published blog posts"
          git push

      - name: Check sitemap (pull requests)
        if: github.event_name == 'pull_request'
        run: python3 generate-sitemap.py --check

      - name: Validate facts
        run: python3 validate-facts.py
