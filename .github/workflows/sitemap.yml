name: Sitemap and facts

# Keeps sitemap.xml and the blog archive (blog/index.html) in step with the
# blog without anyone having to remember.
# Runs on every push to main (including "Add files via upload"), once a day
# just after midnight WAT so scheduled posts are listed on their publish date,
# and on demand from the Actions tab. On pull requests it only checks.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "5 23 * * *"   # 00:05 WAT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Put misplaced blog uploads back at the top level
        if: github.event_name != 'pull_request'
        run: |
          # blog.html and sitemap.xml live at the site root. Uploading them
          # into the blog/ folder by mistake leaves the live blog unchanged.
          if [ -f blog/blog.html ]; then git mv -f blog/blog.html blog.html; fi
          if [ -f blog/sitemap.xml ]; then git rm -q blog/sitemap.xml; fi

      - name: Point uploads at the current preview images
        if: github.event_name != 'pull_request'
        run: |
          # A replaced link-preview card gets a new name (preview-x-v2.jpg,
          # then -v3 ...) and the old file is deleted. Pages generated elsewhere
          # may still use an older name; repoint them so their previews do not
          # break.
          for new in preview-*-v[0-9]*.jpg; do
            [ -e "$new" ] || continue
            stem="${new%-v*.jpg}"
            grep -rhoE --include='*.html' "${stem}(-v[0-9]+)?\.jpg" . | sort -u | while read -r old; do
              [ -e "$old" ] && continue
              grep -rlF --include='*.html' "$old" . | while read -r f; do
                sed -i -E "s#(^|[^a-z0-9-])${old//./\\.}#\1${new}#g" "$f"
              done
            done
          done

      - name: Regenerate blog archive and sitemap
        if: github.event_name != 'pull_request'
        run: |
          python3 generate-blog-archive.py
          python3 generate-sitemap.py

      - name: Commit if anything changed
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "blog archive and sitemap already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update blog archive, sitemap.xml and preview image links"
          git push

      - name: Check blog archive and sitemap (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          python3 generate-blog-archive.py --check
          python3 generate-sitemap.py --check

      - name: Validate facts
        run: python3 validate-facts.py
